<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10243a"><title>MedLit Pocket｜醫學文獻口袋閱讀</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#19324a;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(125deg,#10243a,#17647c);color:white;padding:30px 18px 22px;border-radius:0 0 24px 24px}main{max-width:780px;margin:auto;padding:16px 15px 70px}h1{font-size:25px;margin:0 0 6px}.sub{opacity:.85;font-size:13px;line-height:1.6}.stats{display:flex;gap:10px;margin-top:20px}.stat{background:#ffffff1c;border:1px solid #ffffff29;border-radius:13px;padding:12px;flex:1;font-size:12px}.stat b{display:block;font-size:23px}.tabs,.filters{display:flex;gap:8px;overflow-x:auto;padding:8px 0}.tabs button,.filters button{white-space:nowrap;border:1px solid #dce4eb;border-radius:20px;padding:10px 13px;background:white;color:#31506b;font-weight:650}.tabs button.active,.filters button.active{background:#17647c;color:white;border-color:#17647c}.search{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #d9e3ed;font-size:16px;margin:12px 0}.card{background:white;border:1px solid #e3e9f0;border-radius:18px;padding:18px;margin:13px 0;box-shadow:0 5px 16px #14283b08}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}.badge{background:#e8f4f5;color:#17647c;border-radius:7px;padding:5px 7px;font-size:11px;font-weight:700}.badge.method{background:#f0edff;color:#6550a0}h2{font-size:18px;line-height:1.45;margin:7px 0}h3{font-size:14px;color:#17647c;margin:14px 0 5px}.meta{font-size:12px;color:#607286;line-height:1.5}.bodytext{font-size:14px;line-height:1.8;white-space:pre-line}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.actions button,.actions a{border:1px solid #cfdfe6;background:white;color:#17647c;border-radius:10px;padding:10px 12px;text-decoration:none;font-size:13px;font-weight:700}.actions .primary{background:#17647c;color:white}.note{background:#eaf2f6;border-left:4px solid #17647c;padding:13px;font-size:13px;line-height:1.7;border-radius:9px;margin:13px 0}.empty{text-align:center;color:#6c8191;padding:45px 15px}.hidden{display:none}.foot{font-size:12px;color:#748494;line-height:1.6;text-align:center;margin:22px 0}a{color:#17647c}@media(min-width:720px){header>div{max-width:750px;margin:auto}}
</style></head><body><header><div><div class="sub">PERSONAL RESEARCH LIBRARY · V1.0</div><h1>📚 MedLit Pocket</h1><div class="sub">軍陣醫學教育 × 質性研究｜你的手機文獻閱讀室</div><div class="stats"><div class="stat"><b id="count">0</b>篇精選研究</div><div class="stat"><b id="savedCount">0</b>篇已收藏</div><div class="stat"><b>3 / 10</b>分鐘閱讀模式</div></div></div></header><main><div class="note">🔎 第一階段示範版：收錄已核對 PubMed 的真實論文；目前不是每日自動更新，也尚未接上 AI API。收藏及閱讀紀錄儲存在此瀏覽器，換裝置不會同步。Google Scholar 提供每篇論文的搜尋入口。</div><div class="tabs" id="tabs"><button class="active" data-tab="all">全部文獻</button><button data-tab="saved">⭐ 我的收藏</button><button data-tab="unread">尚未閱讀</button></div><div class="filters" id="filters"><button class="active" data-filter="all">所有主題</button><button data-filter="military">軍陣醫學教育</button><button data-filter="qual">質性分析方法</button><button data-filter="sim">模擬教學</button></div><input class="search" id="search" placeholder="搜尋標題、期刊、研究方法…"><div id="list"></div><div class="foot">資料來源：PubMed 已核對的研究記錄。摘要為原始論文摘要之繁體中文重點整理，非全文分析。<br>期刊是否屬高影響力，應依指定年度及學科分區另行核對。</div></main><script>
const papers=[
{id:'37226058',title:'The Impact of High-fidelity Simulations on Medical Student Readiness',year:2023,journal:'Military Medicine',tags:['military','sim'],method:'Grounded theory',brief:'研究分析約400名軍醫學生在不同年級高擬真演習中的質性資料，探討軍醫學生如何逐步理解部署環境、資源限制與自身角色。研究採紮根理論，以開放與主軸編碼建構概念架構。',insight:'適合參考跨年級課程設計、體驗式學習及反思資料如何轉化成教育研究。',deep:'研究問題：軍醫學生在逐年進階的高擬真訓練中，如何形成對軍陣醫學工作的理解？\n資料與方法：2021–2022年約400名軍醫學生之質性資料；以紮根理論的開放編碼與主軸編碼分析。\n可借鏡之處：可參考其將學習經驗連結到階段性能力成長的分析方式。\n閱讀提醒：質性研究的樣本量不等於效果大小；不能據此推論模擬課程必然提升臨床成效。'},
{id:'37201487',title:"Operation Bushmaster's Impact on Military Medical Student Deployment Readiness",year:2023,journal:'Military Medicine',tags:['military','sim'],method:'Qualitative interviews',brief:'研究訪談19位參與 Operation Bushmaster 的資深軍醫教官。四項主題包括：面對作戰壓力、適應資源匱乏、領導能力發展，以及理解軍事醫療任務。',insight:'可用於規劃軍陣醫學課程的質性主題架構，但應區分教師觀察與學生自身感受。',deep:'研究問題：多日高擬真軍醫演習如何幫助學生準備首次部署？\n資料與方法：訪談19位資深軍醫教官，逐字稿編碼後歸納主題。\n主要主題：壓力適應、資源限制、領導能力、軍事醫療使命。\n限制提醒：資料來自教官觀點，無法直接等同學生能力客觀改善。'},
{id:'37226055',title:'Medical Students’ Integration of Formative Feedback During Simulation: A Grounded Theory Study',year:2023,journal:'Military Medicine',tags:['military','sim'],method:'Grounded theory',brief:'訪談18名四年級醫學生，研究他們如何在多日軍陣醫學模擬中接收並整合形成性回饋。分析提出自我評估、自我效能、領導與團隊合作，以及專業成長等階段。',insight:'與Kolb學習循環、debriefing、反思及形成性回饋的課程研究特別相關。',deep:'研究問題：醫學生如何在連續模擬活動中理解、內化並應用形成性回饋？\n方法：18位四年級醫學生訪談；開放、主軸及選擇性編碼。\n研究產出：提出回饋整合的階段性理論架構。\n應用：可以用來設計心得開放題與回饋歷程的初步敏感概念，但不宜直接把既有四階段當成自己的必然結果。'},
{id:'37226060',title:'“Not for the Faint of Heart”: First-year Military Medical Students’ Professional Identity Formation During the Innovative Patient Experience at Operation Bushmaster',year:2023,journal:'Military Medicine',tags:['military','sim'],method:'Phenomenological qualitative study',brief:'分析175名一年級軍醫學生參與病人角色體驗後的反思文章，探索其軍醫專業認同形成。歸納出軍醫多重角色與在作戰環境中適應、合作的理解。',insight:'與你手上的學生課後心得資料型態相近，適合優先閱讀研究設計與反思文本分析流程。',deep:'研究問題：扮演病人參與軍醫模擬，如何影響一年級軍醫學生的專業認同？\n資料：175篇課後反思文章。\n方法：現象學取向質性研究；研究團隊編碼並協商主題與次主題。\n應用：直接提供以既有學生心得進行回溯性質性分析的寫作範例。\n限制提醒：心得可能受到課程期待、社會期許與反思題目設計影響。'},
{id:'36951634',title:'The Impact of Special Operations Medics and Corpsmen on Military Medical Student Training: A Qualitative Study',year:2023,journal:'Journal of Special Operations Medicine',tags:['military'],method:'Phenomenology',brief:'研究軍醫學生在高擬真野外訓練中接受特戰醫護人員教學的經驗。研究指出兩個主題：更理解軍醫護人員能力，以及體認未來教育者與領導者的角色。',insight:'適合探討跨專業教學、軍醫領導角色與學員身分轉換。',deep:'研究背景：Operation Gunpowder 多日高擬真軍醫野外實習。\n方法：現象學取向質性研究。\n主題：理解特戰醫護能力；意識到軍醫未來的教育與領導責任。\n限制提醒：此為情境特定的質性研究，不能直接推論所有軍陣課程的成效。'},
{id:'39661474',title:'Simulation-based Education’s Impact on Medical Students’ Tolerance of Uncertainty: A Grounded Theory Study',year:2025,journal:'Medical Teacher',tags:['military','sim'],method:'Grounded theory',brief:'訪談15位四年級醫學生，探討高擬真模擬中的不確定性。三個主題為：不可控制的情境造成不確定感、不確定感引發不利反應，以及透過認知重整與合作逐步增加耐受力。',insight:'可作為軍陣醫學教育「壓力、模糊性、決策與團隊合作」質性編碼的對照文獻。',deep:'方法：紮根理論；15名四年級醫學生訪談；持續比較分析。\n研究發現：不確定性的來源、反應，以及透過認知調整和合作提升耐受力。\n應用：適合思考學員在MARCH-E訓練中的不確定性經驗。\n注意：質性研究呈現的是經驗與機制模型，並非證明因果效果。'},
{id:'34585038',title:'A Practical Guide for Conducting Qualitative Research in Medical Education: Part 2—Coding and Thematic Analysis',year:2021,journal:'AEM Education and Training',tags:['qual'],method:'Methods guide',brief:'提供醫學教育質性研究的編碼與主題分析實務指引，以研究範例說明如何從原始訪談文字形成編碼、類別與主題。',insight:'非常適合拿來建立學生心得分析的codebook、研究者討論流程與方法章節。',deep:'文章性質：方法教學文章，而非介入成效研究。\n重點：如何組織質性資料、初步編碼、比較編碼並逐步建構主題。\n應用：可用來規劃你的學生心得分析流程及研究團隊工作。\n注意：不同質性典範對編碼一致性與主題形成的要求並不相同，應先選定研究方法論。'},
{id:'30025784',title:'Thematic Analysis of Qualitative Research Data: Is It as Easy as It Sounds?',year:2018,journal:'Currents in Pharmacy Teaching and Learning',tags:['qual'],method:'Methodological review',brief:'說明嚴謹的主題分析不只是把資料分類，並介紹整理、拆解、重組、詮釋與歸結等分析步驟。',insight:'適合補強質性分析研究方法的透明度與可追溯性。',deep:'文章性質：方法論回顧。\n核心觀點：宣稱使用主題分析，不代表分析自然具備嚴謹性。\n方法建議：清楚記錄資料整理、編碼、整合與詮釋歷程。\n應用：檢查自己的方法章是否交代足夠的分析細節。'},
{id:'41928609',title:'Reflexive Thematic Analysis',year:2026,journal:'Academic Medicine',tags:['qual'],method:'Methods overview',brief:'以簡短教學形式介紹反思式主題分析的定義、分析階段，以及如何由編碼建構主題。',insight:'高關聯的方法文章，適合先建立 reflexive thematic analysis 的核心觀念。',deep:'文章性質：Academic Medicine 的簡明方法教學。\n閱讀重點：反思式主題分析如何理解研究者主觀性、編碼與主題建構。\n注意：反思式主題分析不應機械地等同於以評分者一致率為核心的編碼流程。\n應用：在選擇Braun與Clarke取向時，可作為醫學教育領域的簡要參考。'}
];
const labels={military:'軍陣醫學教育',qual:'質性分析',sim:'模擬教學'};let tab='all',filter='all';const key='medlit-pocket-v1';let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch{};function save(){localStorage.setItem(key,JSON.stringify(state))}function item(id){return state[id]||(state[id]={})}function scholar(title){return 'https://scholar.google.com/scholar?q='+encodeURIComponent('"'+title+'"')}function render(){document.getElementById('count').textContent=papers.length;document.getElementById('savedCount').textContent=papers.filter(p=>item(p.id).saved).length;let q=document.getElementById('search').value.trim().toLowerCase();let results=papers.filter(p=>(filter==='all'||p.tags.includes(filter))&&(tab==='all'||tab==='saved'&&item(p.id).saved||tab==='unread'&&!item(p.id).read)&&[p.title,p.journal,p.method,p.brief].join(' ').toLowerCase().includes(q));document.getElementById('list').innerHTML=results.length?results.map(p=>{let s=item(p.id);return `<article class="card"><div class="badges">${p.tags.map(t=>`<span class="badge">${labels[t]}</span>`).join('')}<span class="badge method">${p.method}</span></div><h2>${p.title}</h2><div class="meta">${p.journal} · ${p.year} · PMID ${p.id} ${s.read?'· ✓ 已閱讀':''}</div><h3>⏱ 3分鐘重點</h3><div class="bodytext">${p.brief}</div><h3>💡 為什麼值得讀</h3><div class="bodytext">${p.insight}</div><div id="deep-${p.id}" class="hidden"><h3>📖 深度閱讀導覽（非全文）</h3><div class="bodytext">${p.deep}</div></div><div class="actions"><button class="primary" onclick="toggleDeep('${p.id}',this)">展開深度導覽</button><button onclick="toggleSaved('${p.id}')">${s.saved?'★ 已收藏':'☆ 收藏'}</button><button onclick="toggleRead('${p.id}')">${s.read?'↩ 標為未讀':'✓ 標為已讀'}</button><a href="https://pubmed.ncbi.nlm.nih.gov/${p.id}/" target="_blank" rel="noopener">PubMed ↗</a><a href="${scholar(p.title)}" target="_blank" rel="noopener">Scholar ↗</a></div></article>`}).join(''):'<div class="empty">沒有符合條件的文章，試試其他分類或關鍵字。</div>'}function toggleSaved(id){item(id).saved=!item(id).saved;save();render()}function toggleRead(id){item(id).read=!item(id).read;save();render()}function toggleDeep(id,btn){let el=document.getElementById('deep-'+id);el.classList.toggle('hidden');btn.textContent=el.classList.contains('hidden')?'展開深度導覽':'收起深度導覽'}document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('active',x===b));render()});document.getElementById('search').oninput=render;render();
</script></body></html>
