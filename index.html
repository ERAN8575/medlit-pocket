<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142a40"><title>MedLit Pocket｜AI醫學文獻閱讀</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#1b344a;background:#f2f6fa}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(125deg,#142a40,#18768a);color:white;padding:27px 18px 22px;border-radius:0 0 24px 24px}header>div,main{max-width:820px;margin:auto}h1{font-size:26px;margin:5px 0}header p{font-size:13px;opacity:.9;line-height:1.6;margin:6px 0}main{padding:17px 15px 70px}.stats{display:flex;gap:9px;margin-top:16px}.stat{flex:1;background:#ffffff20;border:1px solid #ffffff25;border-radius:12px;padding:12px;font-size:12px}.stat b{display:block;font-size:23px}.notice{background:#e7f1f5;border-left:4px solid #18768a;padding:12px;border-radius:9px;font-size:13px;line-height:1.7;margin-bottom:15px}.tabs{display:flex;gap:7px;overflow-x:auto;padding:8px 0}.tabs button{white-space:nowrap;border:1px solid #d3e0e8;border-radius:22px;padding:10px 13px;background:white;color:#365269;font-weight:650}.tabs .active{background:#18768a;color:white;border-color:#18768a}.search{width:100%;padding:13px;border:1px solid #d2e0e9;border-radius:12px;font-size:16px;margin:8px 0}.card{background:white;border:1px solid #e0e8ef;border-radius:18px;padding:19px;margin:14px 0;box-shadow:0 5px 17px #162f4308}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{background:#e6f3f4;color:#18768a;border-radius:6px;padding:5px 7px;font-size:11px;font-weight:700}.badge.gold{background:#fff2d5;color:#865d12}h2{font-size:18px;line-height:1.5;margin:11px 0 7px}.meta{color:#60768b;font-size:12px;line-height:1.7}.reading{margin-top:14px;background:#f6f9fb;padding:13px;border-radius:12px}.reading h3{color:#167086;font-size:15px;margin:0 0 8px}.prose{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.95;font-size:15px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.actions button,.actions a{border:1px solid #cbdde6;border-radius:10px;background:white;color:#146c82;font-size:13px;font-weight:700;padding:10px 11px;text-decoration:none}.actions .primary{background:#16768a;color:white}.muted{font-size:12px;color:#718596}.empty{text-align:center;padding:45px 12px;color:#637c8d}.footer{text-align:center;color:#718596;font-size:12px;line-height:1.7;margin-top:25px}.hide{display:none}button{cursor:pointer}a{color:#146c82}button:focus-visible,a:focus-visible{outline:3px solid #efb955;outline-offset:2px}
</style></head><body><header><div><div style="font-size:12px;letter-spacing:1.2px;opacity:.85">PERSONAL RESEARCH LIBRARY · V2.0</div><h1>📚 MedLit Pocket</h1><p>軍陣醫學教育 × 質性研究 × AI 深度評讀</p><div class="stats"><div class="stat"><b id="total">—</b>篇文獻</div><div class="stat"><b id="saved">0</b>篇收藏</div><div class="stat"><b id="unread">—</b>篇未讀</div></div></div></header><main><div class="notice" id="status" role="status">正在載入 PubMed 文獻資料庫…</div><nav class="tabs" id="tabs" aria-label="閱讀狀態"><button class="active" data-tab="all">全部文章</button><button data-tab="saved">⭐ 我的收藏</button><button data-tab="unread">尚未閱讀</button></nav><nav class="tabs" id="filters" aria-label="研究分類"><button class="active" data-filter="all">全部主題</button><button data-filter="military">軍陣醫學</button><button data-filter="qual">質性分析</button><button data-filter="sim">模擬教學</button></nav><input id="search" class="search" placeholder="搜尋標題、期刊、摘要、PMID…" aria-label="搜尋文獻"><div id="list"></div><p class="footer">來源：PubMed E-utilities；Google Scholar 為外部搜尋連結。<br>AI評讀以 PubMed 摘要為依據，非全文審查；閱讀重要研究時請查閱原文。<br>收藏及已讀狀態僅存在目前瀏覽器。</p></main><script>
'use strict';const labels={military:'軍陣醫學教育',qual:'質性分析',sim:'模擬教學'};let articles=[],tab='all',filter='all';const storageKey='medlit-pocket-v2';let state={};try{state=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch{};function item(id){return state[id]||(state[id]={})}function save(){try{localStorage.setItem(storageKey,JSON.stringify(state))}catch{}}function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}function btn(label,fn,cls){const n=el('button',cls,label);n.type='button';n.addEventListener('click',fn);return n}function link(label,url){const a=el('a','',label);a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a}function toggle(id,field){item(id)[field]=!item(id)[field];save();render()}function scholar(t){return 'https://scholar.google.com/scholar?q='+encodeURIComponent('"'+t+'"')}
function render(){document.getElementById('total').textContent=articles.length;document.getElementById('saved').textContent=articles.filter(a=>item(a.id).saved).length;document.getElementById('unread').textContent=articles.filter(a=>!item(a.id).read).length;const q=document.getElementById('search').value.trim().toLowerCase();const matches=articles.filter(a=>(filter==='all'||(a.tags||[]).includes(filter))&&(tab==='all'||tab==='saved'&&item(a.id).saved||tab==='unread'&&!item(a.id).read)&&[a.title,a.journal,a.abstract,a.id].join(' ').toLowerCase().includes(q));const list=document.getElementById('list');list.replaceChildren();if(!matches.length){list.append(el('div','empty','沒有符合條件的文章，試試其他分類。'));return}for(const a of matches){const s=item(a.id),card=el('article','card'),badges=el('div','badges');for(const t of a.tags||[])badges.append(el('span','badge',labels[t]||t));if(a.priority)badges.append(el('span','badge gold','重點期刊'));card.append(badges,el('h2','',a.title),el('div','meta',`${a.journal||'未知期刊'} · ${a.year||'年份未載'} · PMID ${a.id} ${s.read?' · ✓ 已讀':''}`));const reading=el('section','reading');reading.append(el('h3','','⏱ 快速閱讀｜重點解析'),el('div','prose',a.quick||'尚未產生摘要'));card.append(reading);const deep=el('section','reading hide');deep.append(el('h3','','📖 深度閱讀｜研究方法與批判性評讀'),el('div','prose',a.deep||'尚未產生深度解析'));card.append(deep);if(a.ai_status!=='abstract_only')card.append(el('p','muted','此篇尚未完成AI中文分析；暫提供PubMed原始摘要及閱讀提示。'));else card.append(el('p','muted','AI評讀依據：PubMed摘要，非全文。'));const actions=el('div','actions');const expand=btn('展開深度閱讀',()=>{deep.classList.toggle('hide');expand.textContent=deep.classList.contains('hide')?'展開深度閱讀':'收起深度閱讀'},'primary');actions.append(expand,btn(s.saved?'★ 已收藏':'☆ 收藏',()=>toggle(a.id,'saved')),btn(s.read?'↩ 改未讀':'✓ 標已讀',()=>toggle(a.id,'read')),link('PubMed ↗',a.url||`https://pubmed.ncbi.nlm.nih.gov/${a.id}/`),link('Scholar ↗',scholar(a.title)));if(a.doi)actions.append(link('DOI ↗','https://doi.org/'+encodeURIComponent(a.doi)));card.append(actions);list.append(card)}}document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('active',x===b));render()});document.getElementById('search').addEventListener('input',render);fetch('./data/articles.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{articles=data.articles||[];const stamp=data.generated_at?new Date(data.generated_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}):'未知';document.getElementById('status').textContent=`📅 文獻資料庫更新：${stamp}（台灣時間）。每天約 07:15 自動搜尋 PubMed；AI分析需設定 API 金鑰。`;render()}).catch(err=>{document.getElementById('status').textContent='⚠️ 尚未建立資料庫。請到 GitHub → Actions → Daily PubMed update → Run workflow，完成第一次更新。錯誤：'+err.message;render()});
</script></body></html>
